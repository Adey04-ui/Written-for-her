<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:title" content="💗 A Gift for Adeola">
<meta property="og:description" content="Someone made this just for you...">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f43f6a">
<title>💗 For Adeola</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-50: #fff0f3;
    --pink-100: #ffe4e9;
    --pink-200: #fecdd6;
    --pink-300: #fda4b5;
    --pink-400: #fb6f8e;
    --pink-500: #f43f6a;
    --pink-600: #e11d52;
    --rose-gold: #b76e79;
    --cream: #fff8f8;
    --soft-shadow: 0 8px 32px rgba(244,63,106,0.12);
    --deep-shadow: 0 20px 60px rgba(244,63,106,0.2);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Nunito',sans-serif;
    background: linear-gradient(135deg, var(--pink-50) 0%, var(--cream) 50%, var(--pink-100) 100%);
    min-height:100vh; overflow-x:hidden; color:#5a3d44;
  }
  #particles { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  #confetti-canvas { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100; }

  #gate-screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:5; transition:opacity 0.6s ease; }
  .gate-card { background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); border-radius:32px; padding:48px 36px; text-align:center; box-shadow:var(--deep-shadow); border:1px solid rgba(255,255,255,0.8); max-width:400px; width:90%; animation:popIn 0.7s cubic-bezier(0.22,1,0.36,1); }
  @keyframes popIn { 0%{opacity:0;transform:scale(0.8) translateY(20px)} 100%{opacity:1;transform:scale(1) translateY(0)} }
  .mascot { width:120px; height:120px; margin:0 auto 20px; }
  .mascot svg { width:100%; height:100%; filter:drop-shadow(0 4px 12px rgba(244,63,106,0.2)); }
  .gate-title { font-family:'Playfair Display',serif; font-size:1.6rem; color:var(--pink-600); margin-bottom:8px; }
  .gate-subtitle { color:var(--rose-gold); font-size:0.95rem; margin-bottom:28px; }
  .gate-buttons { display:flex; flex-direction:column; gap:10px; }
  .btn-gate { padding:12px 28px; border-radius:50px; font-weight:700; font-size:0.95rem; cursor:pointer; border:none; transition:all 0.3s ease; font-family:'Nunito',sans-serif; }
  .btn-open { background:linear-gradient(135deg,var(--pink-400),var(--pink-500)); color:white; box-shadow:0 4px 16px rgba(244,63,106,0.3); }
  .btn-open:hover { transform:translateY(-2px); box-shadow:0 6px 24px rgba(244,63,106,0.4); }
  .btn-ghost { background:transparent; color:var(--pink-400); border:2px solid var(--pink-200); }
  .btn-ghost:hover { background:var(--pink-50); border-color:var(--pink-400); }

  #reject-screen { display:none; position:fixed; inset:0; flex-direction:column; align-items:center; justify-content:center; z-index:6; animation:popIn 0.5s ease; }
  .reject-card { background:rgba(255,255,255,0.92); backdrop-filter:blur(20px); border-radius:32px; padding:44px 32px; text-align:center; box-shadow:var(--deep-shadow); border:1px solid rgba(255,255,255,0.8); max-width:360px; width:90%; }
  .mascot-sad { width:100px; height:100px; margin:0 auto 16px; }
  .reject-text { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--pink-600); margin-bottom:20px; }
  .btn-again { background:linear-gradient(135deg,var(--pink-400),var(--pink-500)); color:white; padding:12px 36px; border-radius:50px; border:none; font-family:'Nunito',sans-serif; font-weight:700; font-size:1rem; cursor:pointer; box-shadow:0 4px 16px rgba(244,63,106,0.3); transition:all 0.3s ease; }
  .btn-again:hover { transform:translateY(-2px) scale(1.05); box-shadow:0 6px 24px rgba(244,63,106,0.4); }

  #envelope-stage { display:none; position:fixed; inset:0; align-items:center; justify-content:center; z-index:4; perspective:1200px; }
  .envelope-container { position:relative; width:320px; height:220px; transform-style:preserve-3d; animation:envFloat 3s ease-in-out infinite; }
  @keyframes envFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .envelope { position:absolute; width:100%; height:100%; transform-style:preserve-3d; transition:transform 1.2s cubic-bezier(0.22,1,0.36,1); }
  .envelope.open { transform:rotateX(180deg); }
  .env-back, .env-front, .env-flap { position:absolute; width:100%; backface-visibility:hidden; }
  .env-back { height:100%; background:linear-gradient(135deg,#f8c3cd,#e8a4b8); border-radius:0 0 16px 16px; box-shadow:0 8px 32px rgba(0,0,0,0.1); }
  .env-front { height:100%; background:linear-gradient(135deg,#fddde6,#f8c3cd); border-radius:0 0 16px 16px; clip-path:polygon(0 0,50% 45%,100% 0,100% 100%,0 100%); box-shadow:inset 0 2px 8px rgba(255,255,255,0.5); }
  .env-flap { height:55%; background:linear-gradient(135deg,#f8c3cd,#e8a0b5); clip-path:polygon(0 0,50% 100%,100% 0); transform-origin:top center; transition:transform 0.8s cubic-bezier(0.22,1,0.36,1); border-radius:16px 16px 0 0; z-index:3; }
  .envelope.open .env-flap { transform:rotateX(180deg); }
  .env-seal { position:absolute; top:38%; left:50%; transform:translate(-50%,-50%); width:44px; height:44px; background:linear-gradient(135deg,var(--pink-500),var(--pink-600)); border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.3rem; box-shadow:0 4px 12px rgba(244,63,106,0.3); z-index:4; transition:opacity 0.3s ease; }
  .envelope.open .env-seal { opacity:0; }
  .env-heart-bg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; opacity:0.15; font-size:6rem; z-index:1; }

  #letter-stage { display:none; position:fixed; inset:0; align-items:flex-start; justify-content:center; z-index:5; padding:40px 20px; overflow-y:auto; }
  .letter-card { background:rgba(255,255,255,0.95); backdrop-filter:blur(20px); border-radius:24px; max-width:520px; width:100%; box-shadow:var(--deep-shadow); border:1px solid rgba(255,255,255,0.8); overflow:hidden; transform:translateY(60px) scale(0.9); opacity:0; transition:all 1s cubic-bezier(0.22,1,0.36,1); }
  .letter-card.reveal { transform:translateY(0) scale(1); opacity:1; }
  .letter-header { background:linear-gradient(135deg,var(--pink-100),var(--pink-200)); padding:32px 24px 24px; text-align:center; position:relative; }
  .letter-header::after { content:''; position:absolute; bottom:-20px; left:0; right:0; height:40px; background:var(--pink-100); border-radius:50% 50% 0 0 / 100% 100% 0 0; opacity:0.5; }
  .letter-photo { width:140px; height:140px; border-radius:50%; object-fit:cover; border:5px solid white; box-shadow:0 4px 20px rgba(0,0,0,0.1); margin-bottom:16px; position:relative; z-index:2; background:var(--pink-100); }
  .letter-photo-placeholder { width:140px; height:140px; border-radius:50%; background:linear-gradient(135deg,var(--pink-200),var(--pink-300)); display:flex; align-items:center; justify-content:center; font-size:3rem; margin:0 auto 16px; border:5px solid white; box-shadow:0 4px 20px rgba(0,0,0,0.1); position:relative; z-index:2; }
  .letter-name { font-family:'Playfair Display',serif; font-size:1.8rem; color:var(--pink-600); position:relative; z-index:2; }
  .letter-body { padding:36px 28px 28px; text-align:center; }
  .letter-dear { font-family:'Playfair Display',serif; font-size:1.3rem; color:var(--pink-500); margin-bottom:16px; font-style:italic; }
  .letter-text { font-size:1.05rem; line-height:1.8; color:#6b4c52; margin-bottom:24px; white-space:pre-wrap; }
  .letter-memories { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:24px; }
  .memory-tag { background:linear-gradient(135deg,var(--pink-100),var(--pink-200)); color:var(--pink-600); padding:6px 16px; border-radius:20px; font-size:0.85rem; font-weight:600; border:1px solid rgba(253,164,181,0.3); }
  .letter-footer { border-top:1px dashed var(--pink-200); padding-top:20px; margin-top:8px; }
  .letter-signature { font-family:'Playfair Display',serif; font-size:1.1rem; color:var(--pink-600); font-style:italic; white-space:pre-line; }
  .letter-date { font-size:0.8rem; color:var(--rose-gold); margin-top:4px; }
  .create-own { margin-top:20px; padding-top:16px; border-top:1px solid var(--pink-200); }
  .create-own a { color:var(--pink-500); text-decoration:none; font-weight:600; font-size:0.9rem; }
  .create-own a:hover { text-decoration:underline; }

  .hidden { display:none !important; }
  .fade-out { animation:fadeOut 0.5s ease forwards; }
  @keyframes fadeOut { to { opacity:0; visibility:hidden; } }

  @media (max-width:480px) {
    .gate-card { padding:36px 24px; }
    .reject-card { padding:36px 24px; }
    .letter-card { margin:10px; }
    .envelope-container { width:280px; height:190px; }
  }
</style>
</head>
<body>
<canvas id="particles"></canvas>
<canvas id="confetti-canvas"></canvas>

<div id="gate-screen">
  <div class="gate-card">
    <div class="mascot">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="35" cy="35" rx="14" ry="22" fill="#f8c3cd" transform="rotate(-20 35 35)"/>
        <ellipse cx="85" cy="35" rx="14" ry="22" fill="#f8c3cd" transform="rotate(20 85 35)"/>
        <ellipse cx="35" cy="38" rx="8" ry="14" fill="#fddde6" transform="rotate(-20 35 38)"/>
        <ellipse cx="85" cy="38" rx="8" ry="14" fill="#fddde6" transform="rotate(20 85 38)"/>
        <circle cx="60" cy="65" r="32" fill="#fff0f3"/>
        <defs><radialGradient id="g1" cx="0.3" cy="0.3"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#f8c3cd"/></radialGradient></defs>
        <circle cx="60" cy="65" r="32" fill="url(#g1)" opacity="0.3"/>
        <ellipse cx="42" cy="72" rx="7" ry="4" fill="#fda4b5" opacity="0.5"/>
        <ellipse cx="78" cy="72" rx="7" ry="4" fill="#fda4b5" opacity="0.5"/>
        <circle cx="48" cy="62" r="4" fill="#5a3d44"/><circle cx="50" cy="60" r="1.5" fill="#fff"/>
        <circle cx="72" cy="62" r="4" fill="#5a3d44"/><circle cx="74" cy="60" r="1.5" fill="#fff"/>
        <ellipse cx="60" cy="70" rx="3" ry="2" fill="#fda4b5"/>
        <path d="M56 76 Q60 80 64 76" stroke="#5a3d44" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M60 28 Q52 20 52 32 Q52 40 60 34 Q68 40 68 32 Q68 20 60 28" fill="#f43f6a"/>
        <circle cx="60" cy="32" r="3" fill="#e11d52"/>
      </svg>
    </div>
    <h2 class="gate-title">Do you want to open it?</h2>
    <p class="gate-subtitle">˚ʚ♡ɞ˚ I prepared this gift for you ˚ʚ♡ɞ˚</p>
    <div class="gate-buttons">
      <button class="btn-gate btn-open" onclick="openEnvelope()">💗 Open it</button>
      <button class="btn-gate btn-ghost" onclick="showReject()">No ty</button>
      <button class="btn-gate btn-ghost" onclick="openEnvelope()" style="font-size:0.85rem">Continue →</button>
    </div>
  </div>
</div>

<div id="reject-screen">
  <div class="reject-card">
    <div class="mascot-sad">
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="30" rx="12" ry="18" fill="#f8c3cd" transform="rotate(-35 28 30)"/>
        <ellipse cx="72" cy="30" rx="12" ry="18" fill="#f8c3cd" transform="rotate(35 72 30)"/>
        <circle cx="50" cy="55" r="28" fill="#fff0f3"/>
        <ellipse cx="35" cy="60" rx="6" ry="3.5" fill="#fda4b5" opacity="0.5"/>
        <ellipse cx="65" cy="60" rx="6" ry="3.5" fill="#fda4b5" opacity="0.5"/>
        <path d="M38 52 Q42 48 46 52" stroke="#5a3d44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M54 52 Q58 48 62 52" stroke="#5a3d44" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <circle cx="40" cy="56" r="2" fill="#89cff0" opacity="0.7"/>
        <circle cx="60" cy="56" r="2" fill="#89cff0" opacity="0.7"/>
        <ellipse cx="50" cy="58" rx="2.5" ry="1.8" fill="#fda4b5"/>
        <path d="M46 66 Q50 62 54 66" stroke="#5a3d44" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M50 22 Q44 18 44 26 Q44 32 50 28 Q56 32 56 26 Q56 18 50 22" fill="#f43f6a" opacity="0.8"/>
      </svg>
    </div>
    <h2 class="reject-text">Awh... Let's try again.<br>Please? &gt;.&lt;</h2>
    <button class="btn-again" onclick="showGate()">Again? 💗</button>
  </div>
</div>

<div id="envelope-stage">
  <div class="envelope-container" id="envelope">
    <div class="env-back"></div>
    <div class="env-heart-bg">💗</div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="env-seal">💗</div>
  </div>
</div>

<div id="letter-stage">
  <div class="letter-card" id="letter-card">
    <div class="letter-header">
      <div class="letter-photo-placeholder">💗</div>
      <h2 class="letter-name">Adeola</h2>
    </div>
    <div class="letter-body">
      <div class="letter-dear">Dear my love (｡♡‿♡｡)</div>
      <p class="letter-text">Adeola, my love,<br><br>Happy Girlfriend’s Day to the woman who carries the warmth of the</p>
      <div class="letter-memories"></div>
      <div class="letter-footer">
        <div class="letter-signature">Your Love</div>
        <div class="letter-date">Happy Girlfriend's Day 💗</div>
      </div>
      <div class="create-own">
        <a href="/">💗 Create your own gift</a>
      </div>
    </div>
  </div>
</div>

<script>
const pCanvas = document.getElementById('particles');
const pCtx = pCanvas.getContext('2d');
let particles = [];
function resizeP() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeP); resizeP();
class Particle {
  constructor() { this.reset(); }
  reset() { this.x = Math.random()*pCanvas.width; this.y = pCanvas.height+Math.random()*50; this.size = Math.random()*4+2; this.speed = Math.random()*0.8+0.3; this.wobble = Math.random()*Math.PI*2; this.wobbleSpeed = Math.random()*0.02+0.01; this.opacity = Math.random()*0.4+0.2; this.type = Math.random()>0.5?'heart':'circle'; }
  update() { this.y -= this.speed; this.wobble += this.wobbleSpeed; this.x += Math.sin(this.wobble)*0.5; if(this.y<-20) this.reset(); }
  draw() { pCtx.save(); pCtx.globalAlpha = this.opacity; pCtx.fillStyle = '#fda4b5'; if(this.type==='heart'){ const s=this.size; pCtx.translate(this.x,this.y); pCtx.beginPath(); pCtx.moveTo(0,0); pCtx.bezierCurveTo(-s/2,-s/2,-s,0,0,s); pCtx.bezierCurveTo(s,0,s/2,-s/2,0,0); pCtx.fill(); } else { pCtx.beginPath(); pCtx.arc(this.x,this.y,this.size/2,0,Math.PI*2); pCtx.fill(); } pCtx.restore(); }
}
for(let i=0;i<40;i++) particles.push(new Particle());
function animateParticles() { pCtx.clearRect(0,0,pCanvas.width,pCanvas.height); particles.forEach(p=>{p.update();p.draw();}); requestAnimationFrame(animateParticles); }
animateParticles();

function showReject() { document.getElementById('gate-screen').style.display='none'; document.getElementById('reject-screen').style.display='flex'; }
function showGate() { document.getElementById('reject-screen').style.display='none'; document.getElementById('gate-screen').style.display='flex'; }
function openEnvelope() {
  document.getElementById('gate-screen').style.display='none';
  document.getElementById('reject-screen').style.display='none';
  document.getElementById('envelope-stage').style.display='flex';
  setTimeout(()=>{ burstConfetti(); },300);
  setTimeout(()=>{ document.getElementById('envelope').classList.add('open'); },800);
  setTimeout(()=>{
    document.getElementById('envelope-stage').style.display='none';
    document.getElementById('letter-stage').style.display='flex';
    setTimeout(()=>{ document.getElementById('letter-card').classList.add('reveal'); },100);
  },2800);
}

const cCanvas = document.getElementById('confetti-canvas');
const cCtx = cCanvas.getContext('2d');
let confetti = [];
function resizeC() { cCanvas.width = window.innerWidth; cCanvas.height = window.innerHeight; }
window.addEventListener('resize', resizeC); resizeC();
function burstConfetti() {
  const colors = ['#f43f6a','#fda4b5','#ffc0cb','#ffe4e9','#ff69b4','#ffd700','#ffb6c1'];
  const shapes = ['heart','circle','rect'];
  for(let i=0;i<120;i++) {
    confetti.push({ x:window.innerWidth/2, y:window.innerHeight/2, vx:(Math.random()-0.5)*18, vy:(Math.random()-0.5)*18-4, size:Math.random()*10+4, color:colors[Math.floor(Math.random()*colors.length)], shape:shapes[Math.floor(Math.random()*shapes.length)], rotation:Math.random()*Math.PI*2, rotationSpeed:(Math.random()-0.5)*0.2, gravity:0.15, drag:0.98, life:1, decay:Math.random()*0.008+0.004 });
  }
  animateConfetti();
}
function animateConfetti() {
  if(confetti.length===0){ cCtx.clearRect(0,0,cCanvas.width,cCanvas.height); return; }
  cCtx.clearRect(0,0,cCanvas.width,cCanvas.height);
  confetti.forEach((p,i)=>{
    p.vx*=p.drag; p.vy*=p.drag; p.vy+=p.gravity; p.x+=p.vx; p.y+=p.vy; p.rotation+=p.rotationSpeed; p.life-=p.decay;
    if(p.life<=0){ confetti.splice(i,1); return; }
    cCtx.save(); cCtx.globalAlpha=p.life; cCtx.translate(p.x,p.y); cCtx.rotate(p.rotation); cCtx.fillStyle=p.color;
    if(p.shape==='heart'){ const s=p.size; cCtx.beginPath(); cCtx.moveTo(0,0); cCtx.bezierCurveTo(-s/2,-s/2,-s,0,0,s); cCtx.bezierCurveTo(s,0,s/2,-s/2,0,0); cCtx.fill(); }
    else if(p.shape==='circle'){ cCtx.beginPath(); cCtx.arc(0,0,p.size/2,0,Math.PI*2); cCtx.fill(); }
    else { cCtx.fillRect(-p.size/2,-p.size/2,p.size,p.size); }
    cCtx.restore();
  });
  requestAnimationFrame(animateConfetti);
}
</script>
</body>
</html>
